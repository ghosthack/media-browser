<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Media Browser">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<title>Media Browser</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>

<main id="login" hidden>
  <form id="login-form" autocomplete="off">
    <h1>Media Browser</h1>
    <p>Enter the passkey shown in Media Browser's <b>Phone Access</b> window.</p>
    <input id="login-key" name="passkey" type="text" inputmode="text" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="abcd-efgh-jkmn-pqrs" aria-label="Passkey">
    <button id="login-go" type="submit">Open</button>
    <p id="login-msg" class="msg" role="alert"></p>
  </form>
</main>

<div id="browse" hidden>
  <header id="bar">
    <button id="up" class="icon" type="button" aria-label="Enclosing folder" hidden>&#8249;</button>
    <div id="titles">
      <div id="title"></div>
      <div id="subtitle"></div>
    </div>
    <button id="bell" class="icon" type="button" aria-label="Messages" title="Messages">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15zM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span id="bellcount" hidden></span>
    </button>
    <button id="move" class="word" type="button" title="Select pictures and folders to move">Move</button>
    <button id="reset" class="icon one" type="button" aria-label="Default tile size" title="Default tile size">1:1</button>
    <button id="hide" class="icon" type="button" aria-label="Hide all controls" title="Hide all controls">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>
  <header id="selbar" hidden>
    <button id="selcancel" class="word" type="button">Cancel</button>
    <div id="selcount" aria-live="polite">Select items</div>
    <button id="seladd" class="word strong" type="button" disabled>Add to bag</button>
  </header>
  <nav id="crumbs" aria-label="Location"></nav>
  <div id="grid" role="list"></div>
  <p id="empty" hidden>No photos or videos here.</p>
</div>

<div id="viewer" hidden aria-modal="true" role="dialog">
  <div id="stage"><div id="track"></div></div>
  <div id="vtop" class="chrome">
    <button id="vclose" class="icon" type="button" aria-label="Close">&#215;</button>
    <div id="vtitles"><div id="vname"></div><div id="vcount"></div></div>
    <button id="vreset" class="icon one" type="button" aria-label="Fit to screen" title="Fit to screen">1:1</button>
    <button id="vhide" class="icon" type="button" aria-label="Hide all controls" title="Hide all controls">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="vbottom" class="chrome">
    <button id="rotl" class="icon" type="button" aria-label="Rotate left">&#10226;</button>
    <span id="vnote"></span>
    <button id="rotr" class="icon" type="button" aria-label="Rotate right">&#10227;</button>
  </div>
  <button id="vprev" class="nav icon" type="button" aria-label="Previous">&#8249;</button>
  <button id="vnext" class="nav icon" type="button" aria-label="Next">&#8250;</button>
</div>

<div id="bagdock" hidden>
  <button id="movehere" class="pill strong" type="button" hidden>Move here</button>
  <button id="bagbtn" class="pill" type="button" aria-label="Bag: what to move" title="The bag: what to move">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3zM9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span id="bagcount">0</span>
  </button>
</div>

<div id="bagsheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="bagtitle">
  <div class="panel">
    <div class="phead"><h2 id="bagtitle">Bag</h2><button id="bagclose" class="word" type="button">Done</button></div>
    <p class="hint">Open the folder to move these to, then tap <b>Move here</b>.</p>
    <ul id="baglist" class="rows"></ul>
    <div class="pfoot"><button id="bagempty" class="word danger" type="button">Empty bag</button></div>
  </div>
</div>

<div id="ask" class="sheet center" hidden role="alertdialog" aria-modal="true" aria-labelledby="asktext">
  <div class="panel">
    <p id="asktext"></p>
    <div class="buttons"><button id="askno" class="word" type="button">No</button><button id="askyes" class="word strong" type="button">Yes</button></div>
  </div>
</div>

<div id="result" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="restitle">
  <div class="panel">
    <div class="phead"><h2 id="restitle"></h2><div class="hbtns"><button id="resundo" class="word" type="button" hidden>Undo</button><button id="resclose" class="word strong" type="button">Done</button></div></div>
    <p id="ressum" class="hint"></p>
    <ul id="reslist" class="rows"></ul>
  </div>
</div>


<div id="notice" class="sheet center" hidden>
  <div class="panel" role="alertdialog" aria-live="assertive" aria-labelledby="notice-text">
    <p id="notice-text"></p>
    <div class="nfoot">
      <button id="notice-action" class="word strong" type="button" hidden></button>
      <button id="notice-close" class="word" type="button">
        <span>Dismiss</span>
        <svg class="countdown" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="track" cx="18" cy="18" r="14"/>
          <circle id="notice-ring" class="ring" cx="18" cy="18" r="14"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div id="inbox" class="sheet" hidden>
  <div class="panel">
    <div class="phead"><h2>Messages</h2><button id="inbox-close" class="icon" type="button" aria-label="Close">&#215;</button></div>
    <ul id="inbox-list" class="rows"></ul>
    <p id="inbox-empty" class="hint" hidden>No messages yet.</p>
    <div class="pfoot"><button id="inbox-clear" class="word" type="button">Clear all</button></div>
  </div>
</div>

</body>
</html>
